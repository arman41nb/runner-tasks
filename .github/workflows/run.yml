name: run

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "all | fetch | rewrite | publish | check"
        default: all
      dry_run:
        description: "1 = no side effects"
        default: ""

permissions:
  contents: read

concurrency:
  group: run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Run
        env:
          GUN_API_URL: ${{ secrets.GUN_API_URL }}
          GUN_BOT_TOKEN: ${{ secrets.GUN_BOT_TOKEN }}
          GUN_DRY_RUN: ${{ github.event.inputs.dry_run }}
          MODE: ${{ github.event.inputs.mode || 'all' }}
        run: python worker.py "$MODE"
